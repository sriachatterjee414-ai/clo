<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Hub</title>
<style>
:root{--bg:#ffc9de;--card:#fff0f6;--ink:#5b1a3a;--mute:#9a5c78;--acc:#8e2f5f;--acc2:#ff4d94;--ok:#1b9c6b;--bad:#d6334a;--line:#f2a9c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b0f20;--card:#3d1a2e;--ink:#ffe4f0;--mute:#d79ab7;--line:#5c2c45;--acc:#e0589a}}
:root[data-theme="dark"]{--bg:#2b0f20;--card:#3d1a2e;--ink:#ffe4f0;--mute:#d79ab7;--line:#5c2c45;--acc:#e0589a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:26px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit}
.g .e{font-size:30px}
.g b{display:block;margin-top:4px}
.g small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 12px;font-size:13px}
.msg{text-align:center;font-size:18px;font-weight:700;margin:10px 0;min-height:26px}
.win{color:var(--ok)}.lose{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:38px;font-weight:800;color:var(--ink)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:28px}
.mc.up{background:var(--bg);border:1px solid var(--line)}
.mc.done{background:var(--ok);opacity:.55}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big{font-size:44px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.zone{height:200px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;text-align:center;padding:10px;border:0;width:100%}
input{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:110px;text-align:center}
.lb{width:100%;border-collapse:collapse}
.lb td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
.lb td:first-child{width:34px;font-weight:700;color:var(--mute)}
.lb td.r{text-align:right;color:var(--mute);font-size:13px}
.me td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.note{color:var(--mute);font-size:12px;text-align:center;margin-top:10px}
.tb{display:grid;gap:6px;max-width:300px;margin:0 auto 10px;touch-action:none}
.t2{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
.m3{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:26px;padding:0}
.m3.sel{outline:3px solid var(--acc2)}
.wl{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:260px;margin:0 auto 10px}
.wl div{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;text-transform:uppercase}
.stage{position:relative;margin:0 auto;width:248px;height:182px}
.ts{position:absolute;width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:28px;padding:0;box-shadow:2px 3px 0 var(--line)}
.ts.cov{filter:brightness(.5);pointer-events:none}
.tray{display:flex;gap:4px;justify-content:center;margin-top:10px;min-height:48px;padding:5px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.tray span{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);border-radius:8px}
.app{display:flex}
.side{position:sticky;top:0;align-self:flex-start;width:72px;min-height:100vh;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 4px;background:var(--card);border-right:3px solid var(--acc)}
.av{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.nm{font-size:11px;font-weight:700;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.sb{width:60px;border:0;background:transparent;color:var(--acc);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.sb i{font-style:normal;font-size:26px}.sb.on{color:var(--acc2)}
main{flex:1;min-width:0;max-width:640px;margin:0;padding:14px 12px 96px}
.gc{background:var(--card);border:3px solid var(--acc);border-radius:18px;padding:8px;text-align:center}
.art{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#ffb3d1,#ff7eb0);display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1.1;overflow:hidden;word-break:break-all}
.gc b{display:block;margin:6px 0 4px}
.ar{display:flex;gap:6px}.ar .btn{flex:1;padding:8px 4px;font-size:14px}.btn:disabled{opacity:.5}
.dsc{font-size:12px;color:var(--mute);margin-top:6px;text-align:left}.soon{opacity:.65}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--acc);z-index:50}
.art{background:none;display:block;font-size:0;overflow:hidden;border-radius:14px}
.art svg,.pic svg{display:block;width:100%;height:100%}
.gc{font:inherit;color:var(--ink);width:100%}.gc small{color:var(--mute);font-size:12px}
.hero{text-align:center;margin-bottom:12px}
.hero .pic{width:min(260px,70%);aspect-ratio:1;margin:0 auto 10px;border:4px solid var(--acc);border-radius:20px;overflow:hidden;box-shadow:4px 6px 0 var(--acc)}
.hero h2{margin:4px 0}.hero p{color:var(--mute);font-size:14px;margin:0 0 12px}
.big2{font-size:20px;padding:14px 36px;border-radius:30px;box-shadow:0 4px 0 #5b1a3a}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.lv{aspect-ratio:1;border-radius:50%;border:3px solid var(--acc);background:var(--bg);color:var(--ink);font-weight:800;font-size:16px;padding:0}
.lv.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}.lv.lock{opacity:.45}
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#ff9ec7,#ff4d94);color:#fff;text-align:center;padding:24px}
#gate h1{font-size:36px;margin:0}#gate input{font-size:20px;width:80%;max-width:300px}
.spin{width:38px;height:38px;border:5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
body{background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--acc2) 22%,var(--bg)),var(--bg) 65%) fixed}
.card{box-shadow:0 5px 0 #0002;border:2px solid var(--line)}.btn{box-shadow:0 3px 0 #0003}.gc{box-shadow:0 6px 0 var(--acc)}
.cw{aspect-ratio:1;border-radius:12px;background:#fff5;padding:3px}
.cw.ice{background:linear-gradient(135deg,#e3f8ff,#85d8ff);box-shadow:inset 0 0 0 2px #fff,0 0 8px #8fe3ff}
.cd{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:inset 0 -5px 7px #0003,0 2px 3px #0004;transition:transform .15s;touch-action:none;user-select:none}
body.pl .side,body.pl h1,body.pl .stats{display:none}
body.pl main{max-width:none;padding:10px 8px 96px}
body.pl #game{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh}
body.pl #tu{zoom:1.3}
body.pl #game svg{max-width:min(94vw,64vh)!important}
body.pl .card{padding:8px}
.circ{width:44px;height:44px;border-radius:50%;border:3px solid var(--acc);background:transparent;font-size:20px;padding:0}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<main>
  <h1>🎮 Arcade Hub</h1>
  <div class="stats" id="stats"></div>
  <div id="view"></div>
  <p class="note" id="note"></p>
</main>
</div>
<div id="gate"></div>

/* Tic-Tac-Toe */
function ttt(){
  let b=Array(9).fill(''),over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=p=>L.some(l=>l.every(i=>b[i]===p));
  const el=frame('ttt','<div class="board" id="bd"></div><div class="msg" id="m">Your move (X)</div>');
  const draw=()=>{$('#bd').innerHTML=b.map((v,i)=>`<button class="cell" data-i="${i}" style="color:${v==='X'?'#e5484d':'#2b6cff'};border:3px solid var(--acc);background:var(--card);font-size:56px">${v}</button>`).join('');
    $('#bd').querySelectorAll('.cell').forEach(c=>c.onclick=()=>move(+c.dataset.i))};
  const find=p=>{for(const l of L){const v=l.map(i=>b[i]);if(v.filter(x=>x===p).length===2&&v.includes('')){return l[v.indexOf('')]}}return -1};
  function fin(won,t){over=true;draw();end('ttt',won,t,won?100:/Draw/.test(t)?30:0)}
  function move(i){
    if(over||b[i])return;b[i]='X';
    if(win('X'))return fin(true,'You win! 🎉');
    if(!b.includes(''))return fin(false,'Draw. No win this time.');
    let c=-1;if(Math.random()>=Math.max(0,.7-LV*.1)){c=find('O');if(c<0)c=find('X')}
    if(c<0&&!b[4])c=4;
    if(c<0){const f=b.map((v,k)=>v?-1:k).filter(k=>k>=0);c=f[Math.floor(Math.random()*f.length)]}
    b[c]='O';
    if(win('O'))return fin(false,'CPU wins 🤖');
    if(!b.includes(''))return fin(false,'Draw. No win this time.');
    draw();
  }
  draw();
}

function rps(){

    if(a===c)t+='draw';else if((a-c+3)%3===1){you++;t+='you score'}else{cpu++;t+='CPU scores'}
    if(you===K)return end('rps',true,'You won the match! 🎉',100);

  });
}
/* Memory */
function mem(){
  const E=['🍎','🍌','🍇','🍒','🍉','🍋','🥝','🍑'];
  const cards=[...E,...E].sort(()=>Math.random()-.5);
  let open=[],moves=0,found=0,lock=false;const ML=Math.max(12,30-LV*2);
  frame('mem','<div class="msg" id="m">Moves: 0 (win at '+ML+' or fewer)</div><div class="mem" id="mg"></div>');
  const paint=()=>{$('#mg').innerHTML=cards.map((c,i)=>{const s=cards[i].d?'done':open.includes(i)?'up':'';return`<button class="mc ${s}" data-i="${i}">${s?c.e||c:'?'}</button>`}).join('')};
  const C=cards.map(e=>({e,d:false}));cards.length=0;C.forEach(c=>cards.push(c));
  const paint2=()=>{$('#mg').innerHTML=cards.map((c,i)=>{const s=c.d?'done':open.includes(i)?'up':'';return`<button class="mc ${s}" data-i="${i}">${s?c.e:'?'}</button>`}).join('');
    $('#mg').querySelectorAll('.mc').forEach(b=>b.onclick=()=>flip(+b.dataset.i))};
  function flip(i){
    if(lock||cards[i].d||open.includes(i))return;
    open.push(i);paint2();
    if(open.length===2){
      moves++;$('#m').textContent=`Moves: ${moves} (win at ${ML} or fewer)`;
      const[a,b]=open;
      if(cards[a].e===cards[b].e){cards[a].d=cards[b].d=true;open=[];found++;paint2();
        if(found===8)end('mem',moves<=ML,moves<=ML?`Cleared in ${moves} moves! 🎉`:`Cleared in ${moves} moves. Too slow for a win.`,Math.max(0,1000-moves*25))}
      else{lock=true;setTimeout(()=>{open=[];lock=false;paint2()},700)}
    }
  }
  paint2();
}

function react(){

  frame('react','<button class="zone" id="z"></button>');
  const z=$('#z');
  function arm(){state='wait';z.style.background='#e5484d';z.textContent='Wait for green...';
    timer=setTimeout(()=>{state='go';z.style.background='#1fa971';z.textContent='TAP!';t0=performance.now()},1500+Math.random()*2500)}
  z.onclick=()=>{
    if(state==='wait'){clearTimeout(timer);end('react',false,'Too early! 🙈')}
    else if(state==='go'){const ms=Math.round(performance.now()-t0);state='done';end('react',ms<TH,ms<TH?`${ms} ms. Lightning! ⚡`:`${ms} ms. Need under ${TH}.`,Math.max(0,1000-ms))}
  };
  arm();
}
/* Number guess */
function guess(){
  const R=30+LV*20,n=1+Math.floor(Math.random()*R);let tries=0;
  frame('guess','<div class="msg" id="m">I picked 1-'+R+'. You have 6 tries.</div><div class="row"><input id="in" type="number" inputmode="numeric"><button class="btn" id="go">Guess</button></div>');
  $('#go').onclick=()=>{
    const v=parseInt($('#in').value,10);if(!v)return;tries++;$('#in').value='';
    if(v===n)return end('guess',true,`Got it in ${tries}! 🎉`,(7-tries)*100);
    if(tries>=6)return end('guess',false,`Out of tries. It was ${n}.`);
    $('#m').textContent=`${v} is too ${v<n?'low':'high'}. ${6-tries} left.`;
  };
}
/* Quick math */
function math(){
  let q=0,ok=0,a,b,op,ans;
  frame('math','<div class="msg" id="q"></div><div class="row"><input id="in" type="number" inputmode="numeric"><button class="btn" id="go">Go</button></div><div class="msg" id="m"></div>');
  function next(){
    op=Math.random()<.5?'+':'×';
    a=2+Math.floor(Math.random()*(op==='+'?20+LV*10:8+LV));b=2+Math.floor(Math.random()*(op==='+'?20+LV*10:8+LV));
    ans=op==='+'?a+b:a*b;$('#q').textContent=`${q+1}/5:  ${a} ${op} ${b} = ?`;
  }
  $('#go').onclick=()=>{
    const v=$('#in').value;if(v==='')return;
    if(+v===ans)ok++;q++;$('#in').value='';
    if(q===5)return end('math',ok>=4,`${ok}/5 correct${ok>=4?' 🎉':''}`,ok*100);
    $('#m').textContent=`${ok} correct so far`;next();
  };
  next();
}
/* Chess */
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
const isW=c=>c===c.toUpperCase();
function cgen(b,w){
  const m=[],own=c=>c&&isW(c)===w,foe=c=>c&&isW(c)!==w;
  for(let i=0;i<64;i++){
    const c=b[i];if(!own(c))continue;
    const t=c.toLowerCase(),r=i>>3,f=i&7;
    const add=(r2,f2)=>{if(r2<0||r2>7||f2<0||f2>7)return 0;const j=r2*8+f2;if(own(b[j]))return 0;m.push([i,j]);return b[j]?0:1};
    if(t==='p'){
      const d=w?-1:1,r2=r+d;
      if(r2>=0&&r2<8){
        if(!b[r2*8+f]){m.push([i,r2*8+f]);if(r===(w?6:1)&&!b[(r+2*d)*8+f])m.push([i,(r+2*d)*8+f])}
        [-1,1].forEach(x=>{const f2=f+x;if(f2>=0&&f2<8&&foe(b[r2*8+f2]))m.push([i,r2*8+f2])});
      }
    }else if(t==='n')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,e])=>add(r+a,f+e));
    else if(t==='k'){for(let a=-1;a<2;a++)for(let e=-1;e<2;e++)if(a||e)add(r+a,f+e)}
    else{
      const dirs=[];if(t!=='b')dirs.push([1,0],[-1,0],[0,1],[0,-1]);if(t!=='r')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
      dirs.forEach(([a,e])=>{for(let k=1;k<8;k++)if(!add(r+a*k,f+e*k))break});
    }
  }
  return m;
}
function cmove(b,i,j){const n=b.slice(),c=n[i];n[j]=(c==='P'&&j<8)?'Q':(c==='p'&&j>55)?'q':c;n[i]='';return n}
function inCheck(b,w){return cgen(b,!w).some(([,t])=>b[t]===(w?'K':'k'))}
function legal(b,w){return cgen(b,w).filter(([i,j])=>!inCheck(cmove(b,i,j),w))}
const mat=b=>b.reduce((a,c)=>a+(c?(isW(c)?-1:1)*VAL[c.toLowerCase()]:0),0);
function cpuPick(b){
  const ms=legal(b,false);if(!ms.length)return null;
  if(Math.random()<Math.max(0,.9-LV*.1))return ms[Math.floor(Math.random()*ms.length)];
  let best=-1e9,pick=ms[0];
  ms.forEach(m=>{
    const nb=cmove(b,m[0],m[1]);let v=mat(nb);
    if(LV>=4){legal(nb,true).forEach(r=>{v=Math.min(v,mat(cmove(nb,r[0],r[1])))})}
    v+=Math.random()*.3;if(v>best){best=v;pick=m}
  });

}
function dice(n,z=52){
  const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
  return `<svg width="${z}" height="${z}" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="16" fill="#fff" stroke="#5b1a3a" stroke-width="5"/>${P[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${n===1?'#e5484d':'#222'}"/>`).join('')}</svg>`;
}
function ask(g,groups,go){
  const sel={};groups.forEach(x=>sel[x.k]=x.o[0][0]);
  const draw=()=>{
    frame(g,groups.map(x=>`<div class="msg" style="font-size:15px">${x.l}</div><div class="chips" style="justify-content:center">${x.o.map(([v,l])=>`<button class="chip ${sel[x.k]===v?'on':''}" data-k="${x.k}" data-v="${v}">${l}</button>`).join('')}</div>`).join('')+'<div class="row" style="margin-top:12px"><button class="btn" id="st">Start</button></div>');
    $('#game').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;draw()});
    $('#st').onclick=()=>go(sel);
  };

}
const OPP=[{k:'m',l:'Play against',o:[['bot','🤖 Bot(s)'],['pvp','👥 Friends (pass the phone)']]}];
function chess(){ask('chess',OPP,o=>chess2(o.m==='pvp'))}
function chess2(pvp){
  let b='rnbqkbnrpppppppp'.split('').concat(Array(32).fill(''),'PPPPPPPPRNBQKBNR'.split('')),sel=-1,busy=false,n=0,wt=true;
  const G={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
  frame('chess','<div class="msg" id="m"></div><div class="tb" id="bd" style="grid-template-columns:repeat(8,1fr);gap:0;max-width:340px"></div>');
  const paint=()=>{
    const lm=sel>=0?legal(b,wt).filter(m=>m[0]===sel).map(m=>m[1]):[];
    $('#m').textContent=(inCheck(b,wt)?'Check! ':'')+(pvp?(wt?'White':'Black')+' to move':'Your move (white)');
    $('#bd').innerHTML=b.map((c,i)=>{const w=c&&isW(c);return`<button data-i="${i}" style="aspect-ratio:1;border:0;padding:0;font-size:26px;line-height:1;background:${i===sel?'#ffd24d':lm.includes(i)?'#7fe3a0':((i>>3)+(i&7))%2?'#c0507f':'#ffd9e8'};color:${w?'#fff':'#2a0b1c'};text-shadow:${w?'0 0 3px #000,0 0 3px #000':'none'}">${c?G[c.toLowerCase()]:''}</button>`}).join('');
    $('#bd').querySelectorAll('button').forEach(x=>x.onclick=()=>tap(+x.dataset.i));
  };
  function chk(w){
    const ms=legal(b,w);
    if(ms.length&&n<160)return false;
    if(ms.length){end('chess',false,'Draw by move limit.',150,pvp);return true}
    if(!inCheck(b,w)){end('chess',false,'Stalemate. Draw.',150,pvp);return true}
    if(pvp)end('chess',true,(w?'Black':'White')+' wins by checkmate! 🎉',0,true);
    else if(w)end('chess',false,'Checkmate. CPU wins.',0);
    else end('chess',true,'Checkmate! You win 🎉',Math.max(100,1000-n*8)+LV*50);
    return true;
  }
  function tap(i){
    if(busy)return;const c=b[i];
    if(c&&isW(c)===wt){sel=i;return paint()}
    if(sel<0||!legal(b,wt).some(x=>x[0]===sel&&x[1]===i))return;
    b=cmove(b,sel,i);sel=-1;n++;wt=!wt;paint();
    if(chk(wt))return;
    if(!pvp){
      busy=true;
      setTimeout(()=>{
        if(!document.body.contains($('#bd')))return;
        const m=cpuPick(b);b=cmove(b,m[0],m[1]);wt=true;busy=false;paint();chk(true);
      },350);
    }
  }
  const bdc=$('#bd');
  bdc.onpointerdown=e=>{const x=e.target.closest('button');if(!x||busy)return;const i=+x.dataset.i,c=b[i];if(c&&isW(c)===wt){sel=i;paint()}};
  bdc.onpointerup=e=>{const t=document.elementFromPoint(e.clientX,e.clientY),x=t&&t.closest('button[data-i]');if(x&&sel>=0&&+x.dataset.i!==sel)tap(+x.dataset.i)};

}
/* Ludo: classic cross board, 2-4 players */
function ludo(){ask('ludo',[...OPP,{k:'n',l:'Players',o:[['2','2'],['3','3'],['4','4']]}],o=>ludo2(o.m==='pvp',+o.n))}
function ludo2(pvp,NP){

    $('#ct').innerHTML=`<b style="color:${COL[P[cur]]}">${NM[P[cur]]}</b>${dice(roll||1)}<button class="btn" id="rl" ${human(cur)&&!roll&&!pend?'':'disabled'}>Roll</button><span style="font-size:13px;flex-basis:100%;text-align:center">${msg}</span>`;

/* Snakes & Ladders */
function snl(){ask('snl',[...OPP,{k:'n',l:'Players',o:[['2','2'],['3','3'],['4','4']]}],o=>snl2(o.m==='pvp',+o.n))}
function snl2(pvp,NP){

/* Sudoku */

  };

function water(){

  const tubes=[];for(let t=0;t<NC;t++)tubes.push(pool.slice(t*4,t*4+4));tubes.push([],[]);

  frame('water','<div class="msg" id="m" style="font-size:15px"></div><div class="row" id="tu" style="gap:10px"></div>');
  const paint=()=>{
    $('#m').textContent=`Moves ${moves}. Drag a tube onto another, or tap both.`;

/* Echo Colours */
function simon(){
  const COL=['#ff4d6d','#3ddc84','#4cc9f0','#ffd400'],TG=3+LV*2;let seq=[],pos=0,busy=true,lit=-1;
  frame('simon','<div class="msg" id="m"></div><div id="sm" class="tb" style="grid-template-columns:1fr 1fr;gap:12px;max-width:320px"></div>');
  const paint=()=>{$('#sm').innerHTML=COL.map((c,i)=>`<button data-i="${i}" style="aspect-ratio:1;border:0;border-radius:26px;background:${c};opacity:${lit===i?1:.45};box-shadow:${lit===i?'0 0 24px '+c:'none'};padding:0"></button>`).join('');$('#sm').querySelectorAll('button').forEach(b=>b.onclick=()=>tap(+b.dataset.i))};
  function show(){
    busy=true;pos=0;let i=0;$('#m').textContent=`Watch... ${seq.length}/${TG}`;
    const t=setInterval(()=>{
      if(!document.body.contains($('#sm'))){clearInterval(t);return}

    if(i!==seq[pos])return end('simon',false,`Wrong pad! You reached ${seq.length-1}.`,(seq.length-1)*50);
    pos++;

  }
  paint();next();

function slide(){

  }

  const place=()=>{do{ap=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(p=>p[0]===ap[0]&&p[1]===ap[1]))};
  const draw=()=>{c.clearRect(0,0,300,300);c.font='18px serif';c.fillText('🍎',ap[0]*S+1,ap[1]*S+17);sn.forEach((p,i)=>{c.fillStyle=i?'#ff4d94':'#8e2f5f';c.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2)})};
  const t=setInterval(()=>{
    if(!document.body.contains(cv)){clearInterval(t);return}

    sn.unshift(h);

/* Bird Launch: drag back like a slingshot; red, blue, yellow, bomb birds */
function bird(){
  const px=40,py=150,gy=180,WT=180-Math.min(110,40+LV*8);
  const pigs=Array.from({length:1+(LV>=4?1:0)+(LV>=8?1:0)},(_,i)=>({x:215+i*40+Math.random()*18,y:164,a:true}));
  const types=['red'];if(LV>=2)types.push('blue');if(LV>=4)types.push('yellow');if(LV>=6)types.push('bomb');
  const NB=3+Math.min(3,Math.floor(LV/3)),Q=Array.from({length:NB},(_,i)=>i===0?'red':types[Math.floor(Math.random()*types.length)]);
  const COL={red:'#e5484d',blue:'#3b82f6',yellow:'#ffd400',bomb:'#333'};
  const HINT={red:'Red: a strong plain shot.',blue:'Blue: tap in flight to split in 3!',yellow:'Yellow: tap in flight to dash!',bomb:'Black: tap in flight to explode!'};
  let idx=0,busy=false,drag=null,off=null,P=[],boom=null;
  frame('bird','<div class="msg" id="m" style="font-size:14px"></div><canvas id="cv" width="320" height="200" style="width:100%;background:var(--bg);border-radius:12px;touch-action:none"></canvas>');
  const cv=$('#cv'),c=cv.getContext('2d');
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.width*320]};
  const msg=()=>{$('#m').textContent=`Bird ${idx+1}/${NB} · ${HINT[Q[idx]]} Pigs left: ${pigs.filter(p=>p.a).length}`};
  const body=(x,y,t,r=11)=>{c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=COL[t];c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+r*.35,y-r*.3,r*.32,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+r*.45,y-r*.3,r*.15,0,7);c.fill();c.fillStyle='#ffb300';c.beginPath();c.moveTo(x+r*.8,y);c.lineTo(x+r*1.5,y+r*.3);c.lineTo(x+r*.8,y+r*.5);c.fill()};
  function draw(bx,by,tr){
    c.clearRect(0,0,320,200);c.fillStyle='#7bc47f';c.fillRect(0,gy,320,20);
    c.fillStyle='#a1887f';c.fillRect(150,WT,12,gy-WT);c.fillRect(px-3,py+10,6,gy-py-10);
    c.font='24px serif';pigs.forEach(p=>{if(p.a)c.fillText('🐷',p.x-12,p.y+10)});
    if(tr){c.fillStyle='#8e2f5f';tr.forEach(([x,y])=>{c.beginPath();c.arc(x,y,2.4,0,7);c.fill()})}
    Q.slice(idx+1).forEach((t,i)=>body(14+i*22,16,t,8));
    if(boom){c.beginPath();c.arc(boom.x,boom.y,46,0,7);c.fillStyle='#ff9f1c88';c.fill()}
    if(!busy&&idx<NB)body(bx,by,Q[idx]);
    P.forEach(o=>{if(o.on)body(o.x,o.y,o.t,o.k?7:11)});
  }
  const sim=(vx,vy)=>{let x=px,y=py,v=[];for(let i=0;i<160;i++){x+=vx;y+=vy;vy+=.25;if(y>=gy||x>320||(x>=150&&x<=162&&y>=WT)||pigs.some(p=>p.a&&Math.hypot(x-p.x,y-p.y)<20))break;if(i%4===0)v.push([x,y])}return v};
  function ability(){
    P.filter(o=>o.on&&!o.used).forEach(o=>{
      o.used=true;
      if(o.t==='yellow'){o.vx*=1.9;o.vy*=1.2;snd('swoosh')}
      else if(o.t==='blue'){P.push({x:o.x,y:o.y,vx:o.vx,vy:o.vy-2.2,t:'blue',on:true,used:true,k:1},{x:o.x,y:o.y,vx:o.vx,vy:o.vy+2.2,t:'blue',on:true,used:true,k:1});snd('swoosh')}
      else if(o.t==='bomb'){boom={x:o.x,y:o.y};o.on=false;pigs.forEach(p=>{if(p.a&&Math.hypot(p.x-o.x,p.y-o.y)<46)p.a=false});snd('thud')}
    });
  }
  cv.onpointerdown=e=>{if(busy){ability();return}drag={s:pt(e)}};
  cv.onpointermove=e=>{
    if(!drag||busy)return;const[x,y]=pt(e);let dx=x-drag.s[0],dy=y-drag.s[1];const l=Math.hypot(dx,dy);
    if(l>60){dx*=60/l;dy*=60/l}

  };
  cv.onpointerup=()=>{
    if(!drag)return;drag=null;if(busy)return;let vx=6.5,vy=-5.5;
    if(off&&Math.hypot(off[0],off[1])>=8){vx=-off[0]*.14;vy=-off[1]*.14}
    off=null;fire(vx,vy);
  };
  function fire(vx,vy){
    busy=true;snd('swoosh');P=[{x:px,y:py,vx,vy,t:Q[idx],on:true,used:false}];
    const t=setInterval(()=>{
      if(!document.body.contains(cv)){clearInterval(t);return}
      P.forEach(o=>{
        if(!o.on)return;o.x+=o.vx;o.y+=o.vy;o.vy+=.25;
        pigs.forEach(p=>{if(p.a&&Math.hypot(o.x-p.x,o.y-p.y)<20){p.a=false;snd('pop')}});
        if(o.y>=gy||o.x>330||o.x<-20||(o.x>=150&&o.x<=162&&o.y>=WT))o.on=false;
      });
      draw(px,py);
      if(!P.some(o=>o.on)){
        clearInterval(t);busy=false;P=[];boom=null;idx++;
        const left=NB-idx;
        if(pigs.every(p=>!p.a))end('bird',true,'All pigs popped! 🐷💥',(left+1)*100+pigs.length*50);
        else if(left<=0)end('bird',false,'Out of birds.',pigs.filter(p=>!p.a).length*50);
        else{msg();draw(px,py)}
      }
    },16);
  }
  msg();draw(px,py);
}
/* 2048 */
function g2048(){
  let g=Array.from({length:4},()=>Array(4).fill(0)),sc=0,over=false,won=false,tgt=2**(7+Math.min(LV,5));
  const tr=m=>m[0].map((_,j)=>m.map(r=>r[j]));
  const add=()=>{const f=[];g.forEach((r,i)=>r.forEach((v,j)=>{if(!v)f.push([i,j])}));if(!f.length)return;const[i,j]=f[Math.floor(Math.random()*f.length)];g[i][j]=Math.random()<.9?2:4};
  const row=r=>{const a=r.filter(v=>v),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);sc+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o};
  const L=m=>m.map(row),R=m=>m.map(r=>row([...r].reverse()).reverse());
  const can=()=>g.some((r,i)=>r.some((v,j)=>!v||(j<3&&v===r[j+1])||(i<3&&v===g[i+1][j])));
  frame('g2048','<div class="msg" id="m">Score 0. Swipe or use arrows</div><div class="tb" id="bd" style="grid-template-columns:repeat(4,1fr)"></div><div class="row"><button class="btn sm" data-d="U">↑</button><button class="btn sm" data-d="L">←</button><button class="btn sm" data-d="D">↓</button><button class="btn sm" data-d="R">→</button></div><div class="row" style="margin-top:10px"><button class="btn ghost sm" id="fin">Finish and save score</button></div>');
  $('#fin').onclick=()=>{if(over)return;over=true;end('g2048',won,won?'Nice run! '+tgt+' reached 🎉':'Saved.',sc)};
  const paint=()=>{$('#bd').innerHTML=g.flat().map(v=>`<div class="t2" style="background:${v?`hsl(${335-Math.log2(v)*12},70%,${58-Math.log2(v)*2}%)`:'var(--bg)'}">${v||''}</div>`).join('');$('#m').textContent='Score '+sc};
  function mv(d){
    if(over)return;const b=JSON.stringify(g);
    if(d==='L')g=L(g);if(d==='R')g=R(g);if(d==='U')g=tr(L(tr(g)));if(d==='D')g=tr(R(tr(g)));
    if(JSON.stringify(g)===b)return;
    add();paint();
    if(!won&&g.flat().some(v=>v>=tgt)){won=true;$('#m').textContent=tgt+' reached! Keep going, no limit. Score '+sc}
    if(!can()){over=true;end('g2048',won,'No moves left. Final score '+sc,sc)}
  }
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(b.dataset.d));
  const bd=$('#bd');let sx,sy;
  bd.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  bd.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))};
  add();add();paint();
}
/* Word Guess */
function word(){
  const W='crane slate about house plant water light brain music sound green table chair smile dream ocean river storm cloud beach candy dance eagle flame grape happy juice knife lemon magic night piano queen robot sugar tiger voice whale youth zebra apple bread climb drive earth fresh giant heart'.split(' ');
  const ans=W[Math.floor(Math.random()*W.length)],rows=[],TR=7-Math.min(3,Math.ceil(LV/2));
  frame('word','<div class="wl" id="wl"></div><div class="row"><input id="in" maxlength="5" autocapitalize="none" style="width:130px;text-transform:uppercase"><button class="btn" id="go">Guess</button></div><div class="msg" id="m"></div>');
  const paint=()=>{let h='';for(let i=0;i<TR;i++){const r=rows[i];for(let j=0;j<5;j++){h+=r?`<div style="background:${r[j].c};color:#fff;border-color:${r[j].c}">${r[j].l}</div>`:'<div></div>'}}$('#wl').innerHTML=h};
  function score(w){
    const res=[...w].map(l=>({l,c:'#787c7e'})),left=[...ans];
    res.forEach((x,i)=>{if(x.l===ans[i]){x.c='#1fa971';left[i]=null}});
    res.forEach(x=>{if(x.c!=='#1fa971'){const k=left.indexOf(x.l);if(k>=0){x.c='#c9a227';left[k]=null}}});
    return res;
  }
  $('#go').onclick=()=>{
    const w=$('#in').value.toLowerCase().trim();
    if(!/^[a-z]{5}$/.test(w)){$('#m').textContent='Enter a 5-letter word';return}
    rows.push(score(w));$('#in').value='';paint();
    if(w===ans)return end('word',true,`Got it in ${rows.length}! 🎉`,(7-rows.length)*100);
    if(rows.length===TR)return end('word',false,`It was "${ans}".`);
    $('#m').textContent='';
  };
  paint();
}
/* Match 3: swipe, goals, ice */
function m3(){
  const N=7,K=LV<3?4:5,COL=['#ff4d6d','#ffb703','#3ddc84','#4cc9f0','#b388ff'],FACE=['🍓','🍋','🍏','🫐','🍇'];
  const gk=LV%K,need=10+LV*3,mvMax=Math.max(12,24-LV);
  let g,ice=Array(N*N).fill(0),got=0,mv=mvMax,sc=0,busy=false;
  const rnd=()=>Math.floor(Math.random()*K);
  const find=()=>{const s=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=g[r][c];if(c<N-2&&g[r][c+1]===v&&g[r][c+2]===v)[0,1,2].forEach(k=>s.add(r*N+c+k));if(r<N-2&&g[r+1][c]===v&&g[r+2][c]===v)[0,1,2].forEach(k=>s.add((r+k)*N+c))}return s};
  const bst=Array(N*N).fill(0);
  const drop=s=>{for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(!s.has(r*N+c))col.push([g[r][c],bst[r*N+c]]);while(col.length<N)col.push([rnd(),0]);for(let r=N-1;r>=0;r--){g[r][c]=col[N-1-r][0];bst[r*N+c]=col[N-1-r][1]}}};
  const grow=m=>{for(let ch=1;ch;){ch=0;[...m].forEach(i=>{const b=bst[i];if(!b)return;bst[i]=0;ch=1;const r=i/N|0,c=i%N;if(b==='r')for(let k=0;k<N;k++)m.add(r*N+k);else for(let a=-1;a<2;a++)for(let d=-1;d<2;d++){const y=r+a,x=c+d;if(y>=0&&y<N&&x>=0&&x<N)m.add(y*N+x)}})}};
  const line=i=>{const v=g[i/N|0][i%N];let h=1,w=1,c=i%N,r=i/N|0;for(let k=c-1;k>=0&&g[r][k]===v;k--)h++;for(let k=c+1;k<N&&g[r][k]===v;k++)h++;for(let k=r-1;k>=0&&g[k][c]===v;k--)w++;for(let k=r+1;k<N&&g[k][c]===v;k++)w++;return Math.max(h,w)};
  g=Array.from({length:N},()=>Array.from({length:N},rnd));
  for(let m;(m=find()).size;)drop(m);
  for(let i=0,n=LV>=3?Math.min(14,LV*2):0;i<n;i++)ice[Math.floor(Math.random()*N*N)]=1;
  frame('m3','<div class="msg" id="m" style="font-size:15px"></div><div class="tb" id="bd" style="grid-template-columns:repeat(7,1fr);gap:3px;max-width:340px"></div><div class="note">Swipe a candy to swap it</div>');
  const iceLeft=()=>ice.reduce((a,b)=>a+b,0);
  const paint=()=>{
    $('#m').innerHTML=`Collect <b>${Math.max(0,need-got)}</b> ${FACE[gk]}${iceLeft()?` · Break <b>${iceLeft()}</b> ❄️`:''} · Moves <b>${mv}</b>`;
    $('#bd').innerHTML=g.flat().map((v,i)=>`<div class="cw ${ice[i]?'ice':''}"><div class="cd" data-i="${i}" style="background:radial-gradient(circle at 35% 28%,#ffffffcc,${COL[v]} 55%)">${bst[i]==='r'?'⚡':bst[i]==='b'?'💣':FACE[v]}</div></div>`).join('');
  };
  const sw=(a,b)=>{const t=g[a/N|0][a%N];g[a/N|0][a%N]=g[b/N|0][b%N];g[b/N|0][b%N]=t};
  function step(m){
    if(!m.size){busy=false;paint();
      if(got>=need&&!iceLeft())end('m3',true,'Level goal reached! 🍬',sc+mv*50);
      else if(mv<=0)end('m3',false,'Out of moves.',sc);
      return}
    grow(m);snd('pop');m.forEach(i=>{if(g[i/N|0][i%N]===gk)got++;ice[i]=0});sc+=m.size*10;
    drop(m);paint();setTimeout(()=>{if(document.body.contains($('#bd')))step(find())},260);
  }
  function swipe(a,dx,dy){
    if(busy)return;
    const h=Math.abs(dx)>Math.abs(dy),c=a%N,r=a/N|0,b=h?(dx>0?a+1:a-1):(dy>0?a+N:a-N);
    if(h&&((dx>0&&c===N-1)||(dx<0&&c===0)))return;

    mv--;busy=true;snd('move');step(m);
  }
  const bd=$('#bd');let si=-1,sx=0,sy=0;
  bd.onpointerdown=e=>{const t=e.target.closest('[data-i]');if(t){si=+t.dataset.i;sx=e.clientX;sy=e.clientY}};
  bd.onpointerup=e=>{if(si<0)return;const dx=e.clientX-sx,dy=e.clientY-sy,a=si;si=-1;if(Math.max(Math.abs(dx),Math.abs(dy))>=14)swipe(a,dx,dy)};
  bd.onpointercancel=()=>{si=-1};
  paint();
}
/* Tile Stack: layered tiles, clear sets of 3 */
function tiles(){
  const E=['🍎','🐸','⭐','🍀','🔔','🐟','🍇','🐙','🌙'],NT=Math.min(9,4+LV),P=[];
  [0,1,2,3].forEach(x=>[0,1,2].forEach(y=>P.push([x,y,0])));
  [.5,1.5,2.5].forEach(x=>[.5,1.5].forEach(y=>P.push([x,y,1])));
  P.push([1,1,2],[1.5,.5,2],[2,1,2]);
  const types=[];for(let i=0;i<7;i++)types.push(E[i%NT],E[i%NT],E[i%NT]);
  types.sort(()=>Math.random()-.5);
  let T=P.map(([x,y,z],i)=>({x,y,z,e:types[i],on:true})),tray=[];
  frame('tiles','<div class="msg" id="m">Tap free tiles. 3 alike clear. Tray holds 7.</div><div class="stage" id="st"></div><div class="tray" id="tr"></div>');
  const cov=t=>T.some(o=>o.on&&o.z>t.z&&Math.abs(o.x-t.x)<1&&Math.abs(o.y-t.y)<1);
  const paint=()=>{
    $('#st').innerHTML=T.filter(t=>t.on).sort((a,b)=>a.z-b.z).map(t=>`<button class="ts ${cov(t)?'cov':''}" style="left:${t.x*62-t.z*2}px;top:${t.y*62-t.z*3}px;z-index:${t.z}" data-i="${T.indexOf(t)}">${t.e}</button>`).join('');
    $('#st').querySelectorAll('.ts').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    $('#tr').innerHTML=tray.map(e=>`<span>${e}</span>`).join('');
  };
  function pick(i){
    const t=T[i];if(!t.on||cov(t))return;
    t.on=false;tray.push(t.e);tray.sort();
    const n=tray.filter(e=>e===t.e).length;
    if(n>=3){let k=0;tray=tray.filter(e=>!(e===t.e&&k++<3))}
    paint();
    if(!T.some(x=>x.on))end('tiles',true,'All cleared! 🎉',210);
    else if(tray.length>=7)end('tiles',false,'Tray is full.',T.filter(x=>!x.on).length*10);
  }
  paint();
}

  $('#view').innerHTML=`<div class="card"><div class="top"><b>Most followed</b><small style="color:var(--mute)">You follow ${me.following.length}</small></div><table class="lb">`+
    rows.slice(0,25).map((r,i)=>`<tr class="${r.id===myId?'me':''}"><td>${i+1}</td><td>${esc(nm(r.id))}</td><td class="r">${r.f} follower${r.f===1?'':'s'}</td><td class="r">${r.id===myId?'':`<button class="btn sm ${me.following.includes(r.id)?'ghost':''}" data-f="${r.id}">${me.following.includes(r.id)?'Following':'Follow'}</button>`}</td></tr>`).join('')+'</table></div>';
  $('#view').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>toggleFollow(b.dataset.f));
}
async function gate(){
  const G=$('#gate');
  const API=window.ARCADE_API||'';

  // If this device already has a valid login, use it.
  try{
    const token=localStorage.getItem('ah_token')||'';
    if(token){
      const r=await fetch(API+'/api/session',{headers:{Authorization:'Bearer '+token}});
      if(r.ok){
        const v=await r.json();
        myId=v.id; myName=v.name||'';
        G.remove(); render(); return true;
      }
    }
  }catch(e){}

  let mode='login';
  const draw=()=>{
    G.innerHTML=`
      <div style="font-size:72px">🎮</div>
      <h1>Arcade Hub</h1>
      <p id="authText">${mode==='login'?'Log in to your account':'Create your account'}</p>
      <input id="nmi" maxlength="16" placeholder="Username" autocomplete="username">
      <input id="pin" maxlength="8" inputmode="numeric" placeholder="4-8 digit PIN" autocomplete="${mode==='login'?'current-password':'new-password'}">
      <button class="btn" id="authBtn" style="background:#5b1a3a">${mode==='login'?'Log in':'Create account'}</button>
      <button class="btn ghost" id="switchBtn" style="color:#fff;border-color:#fff;background:transparent">${mode==='login'?'New player? Create an account':'Already have an account? Log in'}</button>
      <div id="authErr" style="min-height:22px;font-size:14px"></div>`;
    $('#switchBtn').onclick=()=>{mode=mode==='login'?'register':'login';draw()};
    $('#authBtn').onclick=async()=>{
      const name=$('#nmi').value.trim(), pin=$('#pin').value.trim(), err=$('#authErr');
      if(!name||!pin){err.textContent='Enter a username and PIN.';return}
      err.textContent='Please wait...';
      try{
        const r=await fetch(API+(mode==='login'?'/api/login':'/api/register'),{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,pin})
        });
        const v=await r.json().catch(()=>({}));
        if(!r.ok){err.textContent=v.error||'Something went wrong.';return}
        localStorage.setItem('ah_token',v.token);
        localStorage.setItem('ah_id',v.id);
        localStorage.setItem('ah_name',v.name);
        myId=v.id; myName=v.name;
        G.remove(); render();
      }catch(e){err.textContent='Could not connect to the game server.'}
    };
  };
  draw();
  return true;
}

async function standaloneDb(){
  const API=window.ARCADE_API||'';
  try{
    const token=localStorage.getItem('ah_token')||'';
    const id=localStorage.getItem('ah_id')||'';
    if(!token||!id)return null;
    const r=await fetch(API+'/api/session',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok)return null;
    const v=await r.json();
    myId=v.id; myName=v.name||localStorage.getItem('ah_name')||'';
    const auth=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});
    return{
      doc:path=>({set:d=>fetch(API+'/api/'+path,{method:'PUT',headers:auth(),body:JSON.stringify(d)}).then(r=>{
        if(r.status===401){try{localStorage.removeItem('ah_token')}catch(e){}}
        return r;
      })}),
      collection:()=>({onSnapshot:cb=>{
        const pull=()=>fetch(API+'/api/players').then(r=>r.json()).then(rows=>cb({
          docs:rows.map(x=>({id:x.id,data:()=>x.data}))
        })).catch(()=>{});
        pull(); setInterval(pull,5000);
      }})
    };
  }catch(e){return null}
}

/* Init */
$('#bk').onclick=()=>{if(playing)playing=null;else if(sel)sel=null;else tab='play';render()};
$('#thm').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'};
const sb=$('#snd');sb.textContent=muted?'🔇':'🔊';
sb.onclick=()=>{muted=!muted;try{localStorage.setItem('ah_mute',muted?'1':'0')}catch(e){}sb.textContent=muted?'🔇':'🔊';snd('click')};

render();
(async()=>{
  try{
    if(window.claude&&claude.use){
      user=await claude.use('user'); db=await claude.use('db');
      if(user){
        try{myId=await user.id()}catch(e){}
        try{const v=await user.me();if(!myName)myName=(v&&v.name)||''}catch(e){}
      }
    }else{
      await gate();
      db=await standaloneDb();
    }
    if(!db||myId==='local'){db=null;render();return}
    db.collection('players').onSnapshot(s=>{
      players={};
      s.docs.forEach(d=>{players[d.id]=d.data()});
      if(!loaded){
        loaded=true;
        const m=players[myId];
        if(m){me.stats=m.stats||{};me.following=m.following||[]}
      }
      delete players[myId];
      if(user&&user.profiles){
        user.profiles(Object.keys(players)).then(ps=>{
          for(const k in ps){names[k]=ps[k]&&ps[k].name||''}
          if(!playing)render();
        }).catch(()=>{});
      }
      if(!playing)render();
    });
    render();
  }catch(e){db=null;render()}
})();
</script>
